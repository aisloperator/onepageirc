<!DOCTYPE html>
<!--
  OnePageIRC
  Generated by AI Sloperator <https://www.aisloperator.com/> using Claude Code.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="generator" content="AI Sloperator (https://www.aisloperator.com/) using Claude Code">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OnePageIRC">
<meta name="description" content="A single page IRC client that runs entirely from static files.">
<title>OnePageIRC</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app" hidden>

  <header id="topbar">
    <button id="btn-menu" class="iconbtn" type="button" title="Connection" aria-label="Connection settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <div id="title-block">
      <div id="title-name">OnePageIRC</div>
      <div id="title-sub">not connected</div>
    </div>
    <button id="btn-users" class="iconbtn" type="button" title="Show user list" aria-label="Show user list" aria-expanded="false" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M16 14.2c2.6-.4 4.5 1.6 4.5 4.8"/></svg>
    </button>
  </header>

  <nav id="tabbar" aria-label="Conversations"></nav>

  <main id="main">
    <div id="views"></div>
    <aside id="userlist" aria-label="Users in channel" hidden>
      <div id="userlist-head"><span id="userlist-count">0 users</span></div>
      <ul id="userlist-items"></ul>
    </aside>
    <div id="scrim" hidden></div>
  </main>

  <form id="composer" autocomplete="off">
    <textarea id="input" rows="1" placeholder="Message, or /command" enterkeyhint="send"
              autocapitalize="sentences" autocorrect="on" spellcheck="true"></textarea>
    <button id="btn-send" class="iconbtn" type="submit" title="Send" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M12.5 5.5 19 12l-6.5 6.5"/></svg>
    </button>
  </form>

</div>

<dialog id="connect-dialog">
  <form id="connect-form" method="dialog">
    <h1>Connect to IRC</h1>

    <label for="f-server">Server</label>
    <input id="f-server" name="server" type="text" inputmode="url" autocapitalize="off"
           autocorrect="off" spellcheck="false" required placeholder="irc.libera.chat">

    <label for="f-port">Port</label>
    <input id="f-port" name="port" type="text" inputmode="numeric" pattern="[0-9]{1,5}"
           autocorrect="off" spellcheck="false" required placeholder="6667">

    <label for="f-nick">Nickname</label>
    <input id="f-nick" name="nick" type="text" autocapitalize="off" autocorrect="off"
           spellcheck="false" required maxlength="30" placeholder="user12345678">

    <details id="advanced">
      <summary>Advanced</summary>

      <label class="check"><input id="f-tls" name="tls" type="checkbox"> Secure WebSocket (wss://)</label>

      <label for="f-path">Gateway path</label>
      <input id="f-path" name="path" type="text" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="/">

      <label for="f-proto">WebSocket subprotocol</label>
      <select id="f-proto" name="proto">
        <option value="">(none)</option>
        <option value="text.ircv3.net">text.ircv3.net</option>
        <option value="binary.ircv3.net">binary.ircv3.net</option>
      </select>

      <label for="f-realname">Real name</label>
      <input id="f-realname" name="realname" type="text" placeholder="OnePageIRC user">

      <label for="f-channels">Auto-join channels</label>
      <input id="f-channels" name="channels" type="text" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="#channel, #other">

      <label for="f-pass">Server password</label>
      <input id="f-pass" name="pass" type="password" autocomplete="off" placeholder="(optional)">

      <label for="f-sasluser">SASL account</label>
      <input id="f-sasluser" name="sasluser" type="text" autocapitalize="off" autocorrect="off"
             spellcheck="false" autocomplete="off" placeholder="(optional)">

      <label for="f-saslpass">SASL password</label>
      <input id="f-saslpass" name="saslpass" type="password" autocomplete="off" placeholder="(optional)">
    </details>

    <p id="connect-note" class="note"></p>
    <p id="connect-error" class="error" hidden></p>

    <menu>
      <button id="btn-cancel" type="button" class="ghost">Cancel</button>
      <button id="btn-connect" type="submit" class="primary">Connect</button>
    </menu>

    <p class="credit">
      Generated by
      <a href="https://www.aisloperator.com/" target="_blank" rel="noopener noreferrer">AI Sloperator</a>
      using Claude Code.
    </p>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
